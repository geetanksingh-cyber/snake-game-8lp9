<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>Neon Snake</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #080b12;
      --panel: rgba(15, 21, 32, 0.8);
      --panel-border: rgba(139, 164, 198, 0.2);
      --text: #edf7ff;
      --muted: #8ea0b8;
      --accent: #62f5b2;
      --accent-strong: #18d889;
      --food: #ff5e91;
      --canvas: #0c1420;
      --shadow: rgba(0, 0, 0, 0.38);
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --page: #eef3f7;
        --panel: rgba(255, 255, 255, 0.82);
        --panel-border: rgba(37, 55, 73, 0.16);
        --text: #172230;
        --muted: #5e7184;
        --accent: #0eaa67;
        --accent-strong: #087c4c;
        --food: #df356d;
        --canvas: #dce7ef;
        --shadow: rgba(33, 54, 74, 0.18);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, rgba(65, 113, 155, 0.18), transparent 42%),
        var(--page);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    .game-shell {
      width: min(100%, 620px);
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.45rem);
      letter-spacing: -0.045em;
      line-height: 1;
    }

    .stats {
      display: flex;
      gap: 10px;
    }

    .stat {
      min-width: 84px;
      padding: 9px 12px;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 9px 26px var(--shadow);
      text-align: right;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .stat-value {
      display: block;
      margin-top: 1px;
      font-size: 1.15rem;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    .board-wrap {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: var(--canvas);
      box-shadow: 0 18px 55px var(--shadow), 0 0 0 5px rgba(255, 255, 255, 0.015);
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      background: var(--canvas);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(5, 9, 15, 0.7);
      backdrop-filter: blur(7px);
      text-align: center;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .overlay[hidden] {
      visibility: hidden;
      opacity: 0;
    }

    .overlay-card {
      width: min(100%, 310px);
      padding: 26px 24px 23px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      background: rgba(16, 24, 36, 0.92);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .overlay h2 {
      margin: 0 0 6px;
      font-size: 1.7rem;
      letter-spacing: -0.04em;
    }

    .overlay p {
      margin: 0 0 20px;
      color: #b4c2d3;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 17px;
      color: #06130d;
      background: var(--accent);
      box-shadow: 0 8px 22px rgba(24, 216, 137, 0.2);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      transition: transform 140ms ease, background 140ms ease;
    }

    button:hover { background: #82ffc9; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid rgba(98, 245, 178, 0.4); outline-offset: 3px; }

    .help {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 13px;
      color: var(--muted);
      font-size: 12px;
    }

    kbd {
      padding: 2px 6px;
      border: 1px solid var(--panel-border);
      border-radius: 5px;
      color: var(--text);
      background: var(--panel);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
    }

    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, minmax(58px, 72px));
      grid-template-rows: repeat(2, minmax(52px, 64px));
      justify-content: center;
      gap: 8px;
      margin: 18px auto 0;
      touch-action: manipulation;
      user-select: none;
    }

    .touch-controls button {
      min-width: 0;
      min-height: 52px;
      padding: 0;
      border: 1px solid rgba(98, 245, 178, 0.24);
      color: var(--text);
      background: var(--panel);
      box-shadow: 0 8px 20px var(--shadow);
      font-size: 1.25rem;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
    }

    .touch-controls button:hover { background: var(--panel); transform: none; }
    .touch-controls button:active,
    .touch-controls button.is-pressed {
      color: #06130d;
      background: var(--accent);
      transform: scale(0.96);
    }

    .touch-controls .up { grid-column: 2; grid-row: 1; }
    .touch-controls .left { grid-column: 1; grid-row: 2; }
    .touch-controls .down { grid-column: 2; grid-row: 2; }
    .touch-controls .right { grid-column: 3; grid-row: 2; }

    @media (hover: none), (pointer: coarse) {
      .touch-controls { display: grid; }
      .help span:first-child { display: none; }
      .help { justify-content: center; }
    }

    @media (max-width: 500px) {
      body { padding: 16px; }
      .topbar { align-items: start; flex-direction: column; }
      .stats { width: 100%; }
      .stat { flex: 1; }
      .help { align-items: start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Arcade / 001</p>
        <h1>Neon Snake</h1>
      </div>
      <div class="stats" aria-label="Game statistics">
        <div class="stat">
          <span class="stat-label">Score</span>
          <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Best</span>
          <span class="stat-value" id="best">0</span>
        </div>
      </div>
    </header>

    <section class="board-wrap" aria-label="Snake game board">
      <canvas id="game" width="600" height="600"></canvas>
      <div class="overlay" id="game-over" hidden>
        <div class="overlay-card">
          <p class="eyebrow">Run complete</p>
          <h2>Game over</h2>
          <p>You scored <strong id="final-score">0</strong> points.</p>
          <button id="restart" type="button">Play again</button>
        </div>
      </div>
    </section>

    <div class="touch-controls" aria-label="Touch controls">
      <button class="up" type="button" data-direction="up" aria-label="Move up">▲</button>
      <button class="left" type="button" data-direction="left" aria-label="Move left">◀</button>
      <button class="down" type="button" data-direction="down" aria-label="Move down">▼</button>
      <button class="right" type="button" data-direction="right" aria-label="Move right">▶</button>
    </div>

    <div class="help">
      <span>Use <kbd>Arrow keys</kbd> or <kbd>WASD</kbd> to steer</span>
      <span>Tap the controls to steer · Speed increases as you grow</span>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const overlay = document.getElementById("game-over");
      const finalScoreEl = document.getElementById("final-score");
      const restartButton = document.getElementById("restart");
      const touchButtons = document.querySelectorAll("[data-direction]");
      const gridSize = 24;
      const cell = canvas.width / gridSize;
      const baseDelay = 145;
      const minDelay = 62;

      let snake;
      let food;
      let direction;
      let queuedDirection;
      let score;
      let best = Number.parseInt(localStorage.getItem("neon-snake-best") || "0", 10);
      let lastTick = 0;
      let running = true;
      let animationFrame;

      bestEl.textContent = best;

      function randomFood() {
        let next;
        do {
          next = {
            x: Math.floor(Math.random() * gridSize),
            y: Math.floor(Math.random() * gridSize)
          };
        } while (snake.some((segment) => segment.x === next.x && segment.y === next.y));
        return next;
      }

      function startGame() {
        snake = [
          { x: 12, y: 13 },
          { x: 11, y: 13 },
          { x: 10, y: 13 },
          { x: 9, y: 13 }
        ];
        direction = { x: 1, y: 0 };
        queuedDirection = { x: 1, y: 0 };
        score = 0;
        food = randomFood();
        running = true;
        lastTick = performance.now();
        scoreEl.textContent = score;
        overlay.hidden = true;
        cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(loop);
      }

      function setDirection(next) {
        if (next.x === -direction.x && next.y === -direction.y) return;
        queuedDirection = next;
      }

      function handleDirectionInput(name) {
        const directions = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 }
        };
        setDirection(directions[name]);
      }

      function update() {
        direction = queuedDirection;
        const head = {
          x: snake[0].x + direction.x,
          y: snake[0].y + direction.y
        };

        const hitWall = head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize;
        const hitSelf = snake.some((segment) => segment.x === head.x && segment.y === head.y);
        if (hitWall || hitSelf) {
          endGame();
          return;
        }

        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          score += 10;
          scoreEl.textContent = score;
          if (score > best) {
            best = score;
            bestEl.textContent = best;
            localStorage.setItem("neon-snake-best", String(best));
          }
          food = randomFood();
        } else {
          snake.pop();
        }
      }

      function endGame() {
        running = false;
        finalScoreEl.textContent = score;
        overlay.hidden = false;
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(144, 177, 205, 0.075)";
        ctx.lineWidth = 1;
        for (let i = 1; i < gridSize; i += 1) {
          const offset = i * cell + 0.5;
          ctx.beginPath();
          ctx.moveTo(offset, 0);
          ctx.lineTo(offset, canvas.height);
          ctx.moveTo(0, offset);
          ctx.lineTo(canvas.width, offset);
          ctx.stroke();
        }

        const pulse = 0.88 + Math.sin(performance.now() / 170) * 0.12;
        ctx.save();
        ctx.shadowBlur = 18 * pulse;
        ctx.shadowColor = "#ff5e91";
        ctx.fillStyle = "#ff5e91";
        ctx.beginPath();
        ctx.arc((food.x + 0.5) * cell, (food.y + 0.5) * cell, cell * 0.29 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        snake.forEach((segment, index) => {
          const inset = index === 0 ? 2.5 : 3.5;
          const radius = 5;
          const x = segment.x * cell + inset;
          const y = segment.y * cell + inset;
          const size = cell - inset * 2;
          ctx.save();
          ctx.shadowBlur = index === 0 ? 16 : 9;
          ctx.shadowColor = index === 0 ? "#62f5b2" : "#18d889";
          ctx.fillStyle = index === 0 ? "#b1ffdb" : "#36e7a0";
          roundedRect(ctx, x, y, size, size, radius);
          ctx.fill();
          ctx.restore();
        });
      }

      function roundedRect(context, x, y, width, height, radius) {
        context.beginPath();
        context.moveTo(x + radius, y);
        context.arcTo(x + width, y, x + width, y + height, radius);
        context.arcTo(x + width, y + height, x, y + height, radius);
        context.arcTo(x, y + height, x, y, radius);
        context.arcTo(x, y, x + width, y, radius);
        context.closePath();
      }

      function loop(timestamp) {
        draw();
        if (!running) return;
        const delay = Math.max(minDelay, baseDelay - score * 1.4);
        if (timestamp - lastTick >= delay) {
          update();
          lastTick = timestamp;
        }
        animationFrame = requestAnimationFrame(loop);
      }

      document.addEventListener("keydown", (event) => {
        const keys = {
          ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 },
          ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
          ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
          ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }
        };
        const next = keys[event.key];
        if (next) {
          event.preventDefault();
          setDirection(next);
        }
      });

      touchButtons.forEach((button) => {
        const press = (event) => {
          event.preventDefault();
          handleDirectionInput(button.dataset.direction);
          button.classList.add("is-pressed");
          window.setTimeout(() => button.classList.remove("is-pressed"), 120);
        };
        button.addEventListener("pointerdown", press);
        button.addEventListener("contextmenu", (event) => event.preventDefault());
      });

      restartButton.addEventListener("click", startGame);
      startGame();
    })();
  </script>
</body>
</html>
